plugins { id 'com.android.application' }
android {
    namespace 'app.netlify.franmotest'
    compileSdk 36
    defaultConfig {
        applicationId 'app.netlify.franmotest'
        minSdk 23
        targetSdk 36
        versionCode = (project.findProperty('qaVersionCode') ?: '19').toString().toInteger()
        versionName = (project.findProperty('qaVersionName') ?: '2.1.7').toString()
        def apiUrl = System.getenv('VITE_SITE_URL')
        def authUrl = System.getenv('VITE_SUPABASE_URL')
        if (!apiUrl || !authUrl) throw new GradleException('Configure Cloudflare and Supabase URLs before building')
        def apiUri = new URI(apiUrl)
        def authUri = new URI(authUrl)
        if (apiUri.scheme != 'https' || authUri.scheme != 'https') throw new GradleException('Backend URLs must use HTTPS')
        def apiHost = apiUri.host
        def authHost = authUri.host
        if (!(apiHost ==~ /[a-z0-9.-]+/) || !(authHost ==~ /[a-z0-9.-]+/)) throw new GradleException('Invalid backend host')
        buildConfigField 'String', 'API_HOST', '"' + apiHost + '"'
        buildConfigField 'String', 'AUTH_HOST', '"' + authHost + '"'
        manifestPlaceholders.appLinkHost = apiHost
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // 1.15 supports Android 6; the WebView engine is system managed.
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
}
