plugins { id 'com.android.application' }
android {
    namespace 'app.netlify.franmotest'
    compileSdk 36
    defaultConfig {
        applicationId 'app.netlify.franmotest'
        minSdk 23
        targetSdk 36
        versionCode = (project.findProperty('qaVersionCode') ?: '19').toString().toInteger()
        versionName = (project.findProperty('qaVersionName') ?: '2.1.7').toString()
        def siteUrl = System.getenv('VITE_SITE_URL')
        def supabaseUrl = System.getenv('VITE_SUPABASE_URL')
        if (!siteUrl || !supabaseUrl) throw new GradleException('Missing migration configuration: VITE_SITE_URL and VITE_SUPABASE_URL must be set')
        def apiHost = new URI(siteUrl).host
        def authHost = new URI(supabaseUrl).host
        if (!(apiHost ==~ /[a-z0-9.-]+/) || !(authHost ==~ /[a-z0-9.-]+/)) throw new GradleException('Invalid backend host')
        buildConfigField 'boolean', 'MIGRATED_BACKEND', 'true'
        buildConfigField 'String', 'API_HOST', '"' + apiHost + '"'
        buildConfigField 'String', 'AUTH_HOST', '"' + authHost + '"'
        manifestPlaceholders.appLinkHost = apiHost
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // 1.15 supports Android 6; the WebView engine is system managed.
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
}
